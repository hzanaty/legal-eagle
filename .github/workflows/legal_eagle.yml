name: 🦅 Legal Eagle Daily Digest

on:
  # 🕖 Runs every day at 07:00 UTC (10 AM KSA / 11 AM Dubai)
  schedule:
    - cron: "0 7 * * *"

  # ▶️ Allow manual trigger from GitHub Actions tab
  workflow_dispatch:

jobs:
  run-legal-eagle:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configurations/requirements.txt

      - name: ▶️ Run Controller
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          python agents/agents_controller.py
