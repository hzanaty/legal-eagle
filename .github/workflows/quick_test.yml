name: Run URL Snap Agent (Test)

on:
  workflow_dispatch:

jobs:
  test-url-snap:
    runs-on: ubuntu-latest

    steps:
      - name: 🧩 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright pyyaml
          python -m playwright install --with-deps chromium

      - name: 🚀 Execute Snap Agent
        working-directory: agents      # ✅ this is where url_snap.py lives
        run: |
          python url_snap.py

      - name: 📤 Upload Snap JSON output
        uses: actions/upload-artifact@v4
        with:
          name: snap-output
          path: agents/snap_output_*.json
