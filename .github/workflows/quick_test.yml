name: 🧪 Test Snapshot Monitor

on:
  workflow_dispatch:    # manual trigger
  schedule:
    - cron: "0 4 * * *"   # 🕓 runs daily at 04:00 UTC (08:00 Gulf time)

permissions:
  contents: write        # ✅ needed for git push

jobs:
  snapshot:
    runs-on: ubuntu-latest

    steps:
      - name: 🧾 Checkout repository
        uses: actions/checkout@v3

      - name: 🐍 Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configurations/requirements.txt

      - name: 🧩 Install Playwright and Chromium
        run: |
          python -m pip install playwright
          python -m playwright install chromium

      - name: ▶️ Run Snapshot Monitor
        run: |
          export PYTHONPATH="${{ github.workspace }}"
          python agents/snapshot_monitor.py

      - name: 💾 Commit snapshots (keep last 2 per site)
        run: |
          git config user.name "Legal Eagle Bot"
          git config user.email "actions@github.com"
          git fetch origin main
          git checkout main
          git pull
          
          # Stage only snapshots folder
          git add snapshots/

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "🧩 Update daily snapshots (auto-rotated)"
            git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git main
            echo "✅ Snapshot changes committed and pushed."
          else
            echo "ℹ️ No new snapshot changes to commit."
          fi
