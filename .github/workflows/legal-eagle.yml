name: Legal Eagle Daily Digest

on:
  schedule:
    - cron: "0 5 * * *"  # Every day at 05:00 UTC
  workflow_dispatch:

jobs:
  run-digest:
    runs-on: ubuntu-latest
    env:
      # Secrets injected from GitHub Actions
      LEGAL_EAGLE_OPENAI_API_KEY: ${{ secrets.LEGAL_EAGLE_OPENAI_API_KEY }}
      LEGAL_EAGLE_TWITTER_BEARER_TOKEN: ${{ secrets.LEGAL_EAGLE_TWITTER_BEARER_TOKEN }}
      LEGAL_EAGLE_GMAIL_EMAIL_SENDER: ${{ secrets.LEGAL_EAGLE_GMAIL_EMAIL_SENDER }}
      LEGAL_EAGLE_GMAIL_APP_PASSWORD: ${{ secrets.LEGAL_EAGLE_GMAIL_APP_PASSWORD }}
      # Optional Admin UI secret (non-sensitive default if not set)
      LEGAL_EAGLE_ADMIN_SECRET: ${{ secrets.LEGAL_EAGLE_ADMIN_SECRET }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r configurations/requirements.txt

      - name: Seed DB if needed (optional)
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          # Seed default profile only if DB is missing; ignore errors if already seeded
          if [ ! -f "configurations/config.db" ]; then
            python scripts/migrate_config_to_sqlite.py || true
          fi

      - name: Run Legal Eagle controller
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          python -c "from agents.agents_controller import run_controller; run_controller()"

      - name: Upload latest outputs (optional)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: latest-outputs
          path: |
            outputs/**/latest_all_news.json
          if-no-files-found: ignore
