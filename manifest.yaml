---
applications:
- name: legal-eagle-ui
  memory: 1G
  disk_quota: 2G
  instances: 1
  buildpacks:
    - https://github.com/cloudfoundry/apt-buildpack
    - python_buildpack
  command: gunicorn --bind 0.0.0.0:$PORT --workers 2 --timeout 120 admin.app:app
  env:
    FLASK_ENV: production
    PYTHONUNBUFFERED: true
  routes:
    - route: legal-eagle-ui.cfapps.eu21.hana.ondemand.com
