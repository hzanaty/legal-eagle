<h1>Pension fund reform bill passes second parliamentary reading</h1>
<p>Published: 30 August 2026 | Source: Ministry of Human Resources</p>
<p>The Pension Fund Reform Bill (Gazette No. 32801) passed its second reading, introducing mandatory pension enrollment for all employees over 18 from 2028.</p>
