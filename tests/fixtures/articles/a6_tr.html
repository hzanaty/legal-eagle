<h1>Employment Law Amendment termination notice (TR coverage)</h1>
<p>Published: 31 August 2026 | Source: XN Turkish Desk</p>
<p>Meclis, İş Kanunu Değişikliği (Law No. 7412) ile 5 yıldan fazla çalışanlar için zorunlu fesih ihbar süresini 30 günden 60 güne çıkardı; 1 Ocak 2027 tarihinde yürürlüğe girecek.</p>
