<h1>Xanadu introduces mandatory health insurance for part-time workers</h1>
<p>Published: 1 September 2026 | Source: XN Official Gazette</p>
<p>A new regulation (Gazette No. 32790) mandates health insurance for part-time workers exceeding 20 hours per week, effective 1 July 2027.</p>
