<h1>Xanadu Ministry updates maternity leave to 16 weeks</h1>
<p>Published: 2 September 2026 | Source: Ministry of Human Resources</p>
<p>The Ministry of Human Resources has issued an amendment to the Employment Act (Law No. 7410) extending statutory maternity leave from 14 to 16 weeks, effective 1 January 2027.</p>
